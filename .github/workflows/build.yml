name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Create Flutter Project Structure
      run: |
        # إنشاء مشروع مؤقت لجلب ملفات الأندرويد والـ Gradle اللازمة
        flutter create temp_app --org com.yrs9.ps4controller --platforms=android
        cp -r temp_app/android ./android
        cp temp_app/pubspec.yaml ./pubspec.yaml
        rm -rf temp_app

    - name: Restore pubspec and lib
      run: |
        # إعادة ضبط الإعدادات وملف الكود الخاص بنا
        git checkout pubspec.yaml

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
